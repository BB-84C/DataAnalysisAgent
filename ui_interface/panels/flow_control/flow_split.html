<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Flow Editor</title>
  <!-- <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.esm.min.mjs';

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    .container {
      display: flex;
      flex-direction: row;
      height: 95vh;
      width: 100%;
    }

    .left, .right {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      padding: 10px;
    }

    .left {
      width: 50%;
      background: #1e1e1e;
      color: #ffffff;
      border-right: 2px solid #ccc;
    }

    .right {
      width: 50%;
      background: #ffffff;
    }

    .dragbar {
      width: 5px;
      cursor: col-resize;
      background-color: #ccc;
    }

    textarea {
      flex-grow: 1;
      width: 100%;
      resize: none;
      font-family: monospace;
      font-size: 14px;
      color: #ffffff;
      background: #2d2d2d;
      border: 1px solid #555;
      padding: 10px;
    }

    #mermaid-container {
      flex-grow: 1;
      overflow: auto;
      padding: 10px;
    }

    .mermaid {
      background-color: #ffffff;
    }
  </style>
</head>

<body>
    <div class="container">
    <div class="left">
      <h4>Flow Editor</h4>
      <textarea id="mermaid-input">
flowchart TD
    MR_1@{ label: "file names = '07_15_25_002.sxm'" } -- in_1 --> OP_1["opensxm"]
    Param_1("pnum = 1") -- in_2 --> OP_1
    OP_1 -- out --> MR_2[("fig_07_15_25_002, 1x1 Figure")]
    MR_2 -- in_2 --> OP_2["background subtraction along row"]
    Param_2("pnum = 2") -- in_2 --> OP_2
    OP_2 -- out --> MR_3[("fig_07_15_25_002_polyback2, 1x1 Figure")]
    MR_3 -- in_1 --> OP_3["fourier transform"]
    Param_3("pnum = 3") -- in_2 --> OP_3
    OP_3 -- out --> MR_4[("fig_07_15_25_002_FT, 1x1 Figure")]
    MR_4 -- in_1 --> OP_4["extract linecut"]
    Param_4("lincut param = [1,1,-1,176,246,176,211]") -- in_2 --> OP_4
    OP_4 -- out --> MR_5[("fig_07_15_25_002_Linecut, 1x1 Figure")]
    MR_1@{ shape: cylinder}</textarea>
    </div>
    <div class="dragbar" id="dragbar"></div>
    <div class="right">
      <h4>Live Preview</h4>
      <div id="mermaid-container">
        <div id="mermaid-output"><div id="theGraph"></div></div>
      </div>
    </div>
  </div>

  
  <script>
    mermaid.initialize({ startOnLoad: true });

    const input = document.getElementById("mermaid-input");
    const output = document.getElementById("mermaid-output");

    function updateMermaid() {
        const code = input.value;
        const cleanCode = code.replace(/^\/\/.*$/gm, "").trim();
        const mermaidDiv = document.createElement("div");
        mermaidDiv.className = "mermaid";
        mermaidDiv.textContent = cleanCode;
        output.innerHTML = "";
        output.appendChild(mermaidDiv);

        try {
            mermaid.init(undefined, mermaidDiv);  // trigger rendering manually
            } catch (e) {
            output.innerHTML = "<p style='color:red;'>Syntax error or render failed</p>";
            console.error(e);
            }
    }

    input.addEventListener("input", updateMermaid);
    window.addEventListener("load", updateMermaid);

    // Optional: enable column resizing
    const dragbar = document.getElementById("dragbar");
    const left = document.querySelector(".left");
    const right = document.querySelector(".right");

    dragbar.onmousedown = function (e) {
      document.onmousemove = function (e) {
        let offset = e.clientX;
        if (offset < 100) offset = 100;
        if (offset > window.innerWidth - 100) offset = window.innerWidth - 100;
        left.style.width = offset + "px";
        right.style.width = (window.innerWidth - offset - 5) + "px";
      };
      document.onmouseup = function () {
        document.onmousemove = null;
      };
    };
  </script>
</body>
</html>
